version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrored_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrored
      POSTGRES_USER: ${POSTGRES_USER:-agrored_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production!!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrored_user} -d agrored"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrored_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Optional: pgAdmin for local DB inspection ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agrored_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agrored.co
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
