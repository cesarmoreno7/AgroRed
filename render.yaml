version: "1"

envVarGroups:
  - name: shared-agrored-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://agrored-web-dashboard.onrender.com
      # ── Email (user password recovery) ──
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # ── SMTP (notification service) ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # ── Logistics ──
      - key: OSRM_URL
        value: https://router.project-osrm.org

services:
  # ── Cache (Render Managed Redis) ──
  - type: redis
    name: agrored-redis
    plan: free
    ipAllowList: []

  # ── Monolith Backend (API Gateway + all services) ──
  - type: web
    name: agrored-api-gateway
    env: node
    buildCommand: npm install --include=dev && npm run build:monolith
    preDeployCommand: npm run migrate
    startCommand: npm run start:monolith
    envVars:
      - fromGroup: shared-agrored-config
      - key: API_GATEWAY_PORT
        value: 8080
      - key: API_GATEWAY_CORS_ORIGIN
        value: https://agrored-web-dashboard.onrender.com
      - key: API_GATEWAY_ORIGIN
        value: https://agrored-api-gateway.onrender.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: agrored-redis
          property: connectionString

  # ── Public Web Dashboard (Static Site) ──
  - type: web
    name: agrored-web-dashboard
    env: static
    buildCommand: npm install --include=dev && npm run build:dashboard
    staticPublishPath: apps/web-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agrored-api-gateway.onrender.com
